<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Register — Guidance Office</title>
    <link rel="stylesheet" href="/css/base.css" />
  </head>
  <body class="auth-body">
    <div class="auth-shell">
      <div class="auth-panel auth-panel--narrow">
        <div class="auth-brand">GCounsel</div>
        <div class="auth-subtitle">Guidance Office Admin</div>

        <form id="registerForm" class="auth-form">
          <div class="field-block">
            <label class="field-label" for="name">Full Name</label>
            <input class="field-input" type="text" id="name" required autocomplete="name" />
          </div>

          <div class="field-block">
            <label class="field-label" for="title">Title</label>
            <input class="field-input" type="text" id="title" placeholder="e.g. Guidance Counselor" />
          </div>

          <div class="field-block">
            <label class="field-label" for="email">Email</label>
            <input class="field-input" type="email" id="email" required autocomplete="username" />
          </div>

          <div class="field-block">
            <label class="field-label" for="password">Password</label>
            <div class="password-wrap">
              <input class="field-input" type="password" id="password" required minlength="8" autocomplete="new-password" />
              <button type="button" class="toggle-password" aria-label="Show password">Show</button>
            </div>
          </div>

          <button type="submit" class="btn btn-dark auth-button">Create Account</button>
          <div class="errorMessage" id="errorMsg"></div>
        </form>
      </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/register.js"></script>
  </body>
</html>
