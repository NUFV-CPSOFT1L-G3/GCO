<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin & Guidance Office Login — GCOunsel</title>
    <link rel="stylesheet" href="/css/base.css" />
  </head>
  <body class="auth-body">
    <header class="mainHeader">
      <div class="headerLeft">
        <div class="brandName">GCOunsel</div>
      </div>
      <div class="headerRight">
        <a href="/" class="nav-portal-link">← Student Booking Portal</a>
      </div>
    </header>

    <div class="auth-shell">
      <div class="auth-panel">
        <div class="auth-brand">GCOunsel</div>
        <div class="auth-subtitle">Guidance Counseling Appointment Management</div>

        <div class="auth-access-title">Admin and Guidance Office Access</div>

        <!-- Microsoft 365 / NU Faculty & Staff Sign In -->
        <div class="auth-oauth-section" style="margin-bottom: 12px;">
          <button type="button" class="btn btn-microsoft" id="microsoftLoginBtn">
            <svg viewBox="0 0 21 21" width="18" height="18" style="vertical-align: middle;">
              <rect x="1" y="1" width="9" height="9" fill="#f25022"/>
              <rect x="11" y="1" width="9" height="9" fill="#7fba00"/>
              <rect x="1" y="11" width="9" height="9" fill="#00a4ef"/>
              <rect x="11" y="11" width="9" height="9" fill="#ffb900"/>
            </svg>
            <span>Sign in with NU Account (Microsoft)</span>
          </button>
          <div class="field-hint" style="text-align: center; margin-top: 6px;">For authorized faculty & staff (@nu-fairview.edu.ph)</div>
        </div>

        <div class="auth-divider">
          <span>OR SIGN IN WITH PASSWORD</span>
        </div>

        <form id="loginForm" class="auth-form">
          <div class="field-block">
            <label class="field-label" for="email">Email / Username</label>
            <input class="field-input" type="email" id="email" required autocomplete="username" placeholder="e.g. counselor@nu-fairview.edu.ph" />
          </div>

          <div class="field-block">
            <label class="field-label" for="password">Password</label>
            <div class="password-wrap">
              <input class="field-input" type="password" id="password" required autocomplete="current-password" placeholder="••••••••" />
              <button type="button" class="toggle-password" aria-label="Show password">Show</button>
            </div>
          </div>

          <button type="submit" class="btn btn-dark auth-button" id="loginSubmitBtn">Log In</button>
          <div class="errorMessage" id="errorMsg"></div>
        </form>
      </div>
    </div>

    <!-- Firebase Compat CDN Scripts -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="/js/firebase-config.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/login.js"></script>
  </body>
</html>
