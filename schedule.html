<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Counselor Calendar & Schedule — GCOunsel</title>
    <link rel="stylesheet" href="/css/base.css" />
  </head>
  <body>
    <div class="app" id="app"></div>

    <div class="modal-overlay" id="cancelModal" style="display: none;">
      <div class="modal-card">
        <h3 class="modal-title">Cancel Appointment</h3>
        <p class="modal-desc" id="cancelApptDetails">Please specify the reason for cancelling this appointment:</p>
        <form id="cancelForm">
          <input type="hidden" id="cancelApptId" />
          <div class="field-block">
            <label class="field-label" for="cancelReason">Reason for Cancellation <span class="req">*</span></label>
            <select id="cancelReason" class="field-input" required>
              <option value="">-- Select Predefined Reason --</option>
              <option value="Student Requested Cancellation">Student Requested Cancellation</option>
              <option value="Counselor Unavailable">Counselor Unavailable</option>
              <option value="Office Closure or Holiday">Office Closure or Holiday</option>
              <option value="Emergency">Emergency</option>
              <option value="Others with remarks">Others with remarks</option>
            </select>
          </div>
          <div class="field-block">
            <label class="field-label" for="cancelRemarks">Remarks / Notes (Optional)</label>
            <textarea id="cancelRemarks" class="field-input" rows="2" placeholder="Additional explanation..."></textarea>
          </div>
          <div class="errorMessage" id="cancelError"></div>
          <div class="modal-actions">
            <button type="button" class="btn" id="closeCancelModalBtn">Keep Appointment</button>
            <button type="submit" class="btn btn-danger" id="confirmCancelBtn">Confirm Cancellation</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Firebase Compat CDN Scripts -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="/js/firebase-config.js?v=20261013"></script>
    <script src="/js/auth.js?v=20261013"></script>
    <script src="/js/nav.js?v=20261013"></script>
    <script src="/js/schedule.js?v=20261014"></script>
  </body>
</html>
